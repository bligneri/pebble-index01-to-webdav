[package]
name = "pebble-index01-to-webdav"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pebble Index 01 webhook to CalDAV journals, notes and todos (jtx Board)"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono-tz = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
